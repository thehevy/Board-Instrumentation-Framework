# Gradle proxy configuration
# Uncomment and configure if behind a corporate firewall/proxy
# Required for downloading Gradle distribution and dependencies

# HTTP Proxy (uncomment and set your proxy details)
# systemProp.http.proxyHost=proxy.company.com
# systemProp.http.proxyPort=8080
# systemProp.http.nonProxyHosts=localhost|127.0.0.1

# HTTPS Proxy (uncomment and set your proxy details)
# systemProp.https.proxyHost=proxy.company.com
# systemProp.https.proxyPort=8080
# systemProp.https.nonProxyHosts=localhost|127.0.0.1

# Optional: Uncomment if proxy requires authentication
# systemProp.http.proxyUser=your_username
# systemProp.http.proxyPassword=your_password
# systemProp.https.proxyUser=your_username
# systemProp.https.proxyPassword=your_password
